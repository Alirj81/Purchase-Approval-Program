services:
  database:
    image: postgres:17-alpine
    container_name: purchase-approval-db
    environment:
      POSTGRES_DB: purchase_approval_dev
      POSTGRES_USER: purchase_approval_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - purchase_approval_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U purchase_approval_app -d purchase_approval_dev"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  purchase_approval_data: